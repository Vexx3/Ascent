name: Check the guide

# Builds the guide on every pull request, so a broken link or a page that will
# not render is caught before it is merged rather than when the site deploys.
# Every pull request rather than only those touching docs/: this is a required
# check on main, and a required check that never starts blocks the merge.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run docs:build
