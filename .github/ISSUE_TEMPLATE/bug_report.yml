name: Bug report
description: Something in the kit does not work the way the guide says it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. A bug with the version, the steps and the Output log is usually fixed in the next update; one without them usually is not.

        Not sure whether it is the kit or your place? Ask in [Discussions](https://github.com/Vexx3/Ascent/discussions) first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: I pressed **Check** in the Ascent Setup plugin, and it does not explain this.
          required: true
        - label: I searched the existing issues for this.
          required: true
        - label: This report contains no kit place file, no whole kit script, and no webhook URL or other secret.
          required: true
  - type: input
    id: version
    attributes:
      label: Kit version
      description: Press Play and read the `Ascent` line in the Output, such as `Ascent 2.0.0 (stable)`, or run `kit-info` in the admin console (F4 by default).
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where it happens
      multiple: true
      options:
        - A tower place
        - The hub (ring select)
        - The Ascent Setup plugin
        - Studio only
        - The live game only
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From opening the place. The smaller the better.
      placeholder: |
        1. Open a tower place
        2. ...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Support report or Output
      description: In Studio, press Play and make the bug happen, then stop and press **Print a report for support** in the plugin's Check window. Paste the report here. Without the plugin, paste what the Output printed. Check it for webhook URLs first.
      render: text
  - type: textarea
    id: changes
    attributes:
      label: What you changed from the kit
      description: Config values you edited, scripts you changed, menus you renamed. "Nothing" is a useful answer.
  - type: textarea
    id: fix
    attributes:
      label: A fix, if you have one
      description: Only the lines you changed, and the script's Explorer path. If a small place shows the problem, share it privately in the Discord and say so here.
      render: lua
