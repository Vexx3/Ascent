<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ascent">
  <!--
    A tower read as stacked floors, narrowing as it climbs. One hue stepped by
    opacity rather than a two-colour gradient, so it stays legible at favicon
    size and does not fight the page.
  -->
  <g fill="#7c3aed">
    <rect x="12" y="44" width="40" height="9" rx="2.5" />
    <rect x="16" y="32" width="32" height="9" rx="2.5" opacity="0.85" />
    <rect x="20" y="20" width="24" height="9" rx="2.5" opacity="0.7" />
    <rect x="24" y="8" width="16" height="9" rx="2.5" opacity="0.55" />
  </g>
</svg>
