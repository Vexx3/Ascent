<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Ascent">
  <!--
    A tower read as stacked floors, narrowing as it climbs, in the orange
    Studio shows on the folders a buyer edits. One flat colour, so it reads on
    a light or dark page and at favicon size.
  -->
  <g fill="#ff641e">
    <rect x="10" y="46" width="44" height="9" rx="1" />
    <rect x="15" y="34" width="34" height="9" rx="1" />
    <rect x="20" y="22" width="24" height="9" rx="1" />
    <rect x="25" y="10" width="14" height="9" rx="1" />
  </g>
</svg>
